[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fancyclock"
# Single source of truth: the version is read from the VERSION file at build
# time (the runtime reads the same file via fancyclock.version). Never
# hardcode a version here.
dynamic = ["version"]
description = "Cross-platform desktop clock with analog and digital modes"
authors = [{name = "Oliver Ernster", email = "oernster@codecrafter.uk"}]
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7.0"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["fancyclock*"]

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = """
(
  \\bvenv\\b
  | \\bbuild\\b
  | \\bdist\\b
)
"""

[tool.ruff]
line-length = 88
extend-exclude = ["venv", "build", "dist"]

[tool.ruff.lint]
# BLE is selected on top of the defaults so an unexplained blind `except
# Exception` fails the lint rather than relying on review to spot it. Every
# handler in the tree is either narrowed to the exceptions actually expected or
# marked `# noqa: BLE001` with the fallback it takes written beside it. There
# is no per-file ignore: the installer does the most privileged work in the
# product, so exempting it would announce a rule while excusing the code that
# most needs it.
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fancyclock --cov-report=term-missing --cov-fail-under=100 --cov-config=.coveragerc"
pythonpath = ["."]
